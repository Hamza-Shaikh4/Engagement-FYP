<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reading App — Results</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="app">
    <div class="page">

      <header class="topbar">
        <a class="iconbtn" href="/" title="Home" aria-label="Home">🏠</a>
        <div class="title">My Results</div>
        <span style="width:38px;"></span>
      </header>

      <section class="section stack">
        <div class="stats">
          <div class="stat">
            <div class="k">Books Read</div>
            <div class="v">2</div>
          </div>
          <div class="stat">
            <div class="k">Days Logged In</div>
            <div class="v">1</div>
          </div>
          <div class="stat">
            <div class="k">Current Streak</div>
            <div class="v">0 🔥</div>
          </div>
          <div class="stat">
            <div class="k">Active Avatar</div>
            <div class="v">🙂</div>
          </div>
        </div>

        <div class="section" style="padding:12px;">
          <div class="row" style="display:flex;justify-content:space-between;color:var(--muted);font-weight:700;">
            <span>Level</span><span>2</span>
          </div>
          <div class="bar" style="margin-top:8px;"><div style="width:45%;"></div></div>
        </div>

        <div class="toast">
          Prototype note: Replace these placeholder values with live values from backend/session later.
        </div>
      </section>

    </div>
  </main>
</body>
</html>
