<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reading App — Home</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="app">
    <div class="page">

      <header class="topbar">
        <button class="iconbtn" title="Home" aria-label="Home">🏠</button>
        <div class="title">Reading App</div>
        <button class="iconbtn" title="Menu" aria-label="Menu">📚</button>
      </header>

      <section class="section stack">
        <a class="bigbtn" href="/books">
          <span class="emoji">📚</span>
          <span>My Books</span>
        </a>

        <a class="bigbtn" href="/reading">
          <span class="emoji">📖</span>
          <span>Daily Reading</span>
        </a>

        <a class="bigbtn" href="/results">
          <span class="emoji">📋</span>
          <span>Check Results</span>
        </a>

        <a class="bigbtn" href="/avatar">
          <span class="emoji">🧑</span>
          <span>Avatar Customisation</span>
        </a>


      </section>

    </div>
  </main>

</html>
