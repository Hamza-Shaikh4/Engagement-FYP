<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quick Check</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body data-bg="{{ state['selected_bg'] }}">
  <main class="app">
    <div class="page">
      <header class="topbar">
        <a class="iconbtn" href="/" title="Home" aria-label="Home">🏠</a>
        <div class="title">Quick Check</div>
        <span style="width:38px;"></span>
      </header>

      <section class="section stack">
        <div class="toast">
          Quick story check for: <strong>{{ story_title }}</strong>
        </div>

        <div id="quizContainer" class="section" style="padding:12px;">
          Loading quiz...
        </div>

        <div class="navrow">
          <button id="submitQuizBtn" class="smallbtn" type="button">Submit Quiz ✅</button>
        </div>
      </section>
    </div>
  </main>

  <script>
    window.STORY_ID = "{{ story_id }}";
  </script>
  <script src="/static/quiz.js"></script>
  <script src="/static/app_state.js"></script>
</body>
</html>
