<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reading</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>

<body data-bg="{{ state.selected_bg }}">
  <main class="app">
    <div class="page">

      <header class="topbar">
        <a class="iconbtn" href="/" title="Home" aria-label="Home">🏠</a>
        <div class="title">Reading</div>
        <a class="iconbtn" href="/books" title="Books" aria-label="Books">📚</a>
      </header>

      <section class="section">
        <div class="reader" id="reader">Loading story...</div>

        <div class="navrow">
          <a class="smallbtn" href="/books">← Library</a>
          <button class="smallbtn" id="finishReadingBtn" type="button">Finish Book ✅</button>
        </div>

        <div class="toast" id="readingToast">
          Tip: Read normally. Engagement detection runs in the background.
        </div>
      </section>

    </div>
  </main>

  <script>
    window.STORY_ID = "{{ story_id }}";
  </script>

  <script src="/static/reading.js"></script>
  <script src="/static/tracker.js"></script>
  <script src="/static/app_state.js"></script>
</body>
</html>
